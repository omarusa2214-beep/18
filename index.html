<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الشطرنج الشاملة - نسخة المحترفين</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        /* التصميم المشابه لـ Chess.com */
        body { 
            background-color: #312e2b; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* حاوية الدخول وكلمة المرور */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #312e2b;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: background-color 0.3s;
        }
        .login-box {
            background-color: #262421;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 350px;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #4c4a47;
            background-color: #312e2b;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            font-size: 16px;
            text-align: center;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        /* حاوية اللعبة الأساسية */
        #gameContainer {
            display: none; 
            width: 100%; 
            flex-direction: column; 
            align-items: center; 
            margin-top: 20px; 
            padding: 0 10px;
            box-sizing: border-box;
        }

        .container-w {
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            transition: max-width 0.3s ease;
        }

        #board { 
            width: 100%; 
            max-width: 480px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            transition: max-width 0.3s ease;
        }
        
        .info-container { 
            text-align: center; 
            margin-bottom: 15px; 
            background-color: #262421;
            padding: 15px 20px;
            border-radius: 8px;
            transition: background-color 0.3s, max-width 0.3s;
        }
        h2 { margin: 0 0 10px 0; color: #fff; font-size: 22px; transition: color 0.3s; }
        
        .settings-grid, .buttons-grid, .auto-play-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        #gameMode {
            grid-column: span 2;
        }
        
        select {
            background-color: #363431;
            color: #fff;
            border: 1px solid #4c4a47;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        button { 
            background-color: #363431; 
            color: #c3c2c1; 
            border: none; 
            padding: 12px 10px; 
            font-size: 14px; 
            font-weight: bold;
            cursor: pointer; 
            border-radius: 8px; 
            transition: background-color 0.2s, color 0.2s;
        }
        button:hover { background-color: #4c4a47; color: #fff; }
        
        .btn-primary {
            background-color: #81b64c !important;
            color: white !important;
            grid-column: span 2;
            font-size: 18px;
        }
        .btn-primary:hover { background-color: #95c961 !important; }

        .btn-danger {
            background-color: #cc3333 !important;
            color: white !important;
            grid-column: span 2;
            font-size: 18px;
        }
        .btn-danger:hover { background-color: #e60000 !important; }
        
        #status { 
            font-size: 1.2em; 
            font-weight: bold; 
            color: #81b64c; 
        }

        /* تنسيقات إظهار الحركات والألوان */
        .highlight-square {
            background-color: rgba(255, 255, 0, 0.4) !important;
            cursor: pointer;
        }
        .highlight-last-move {
            background-color: rgba(155, 199, 0, 0.6) !important;
        }
        .square-55d63 {
            cursor: pointer; 
        }
        .legal-move-indicator {
            width: 30%;
            height: 30%;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            position: absolute;
            top: 35%;
            left: 35%;
            pointer-events: none;
            z-index: 10;
        }
        .legal-move-indicator.capture {
            width: 80%;
            height: 80%;
            background-color: transparent;
            border: 5px solid rgba(0, 0, 0, 0.4);
            top: 10%;
            left: 10%;
            box-sizing: border-box;
        }

        /* تصميم التوقيت (المؤقت) */
        .timer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .timer-box {
            background-color: #262421;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .timer-box span:nth-child(2) {
            font-size: 24px;
            font-weight: bold;
            font-family: monospace;
            display: block;
            margin-top: 5px;
        }
        .timer-active {
            border-color: #81b64c;
            background-color: #312e2b;
            box-shadow: 0 0 10px rgba(129, 182, 76, 0.5);
        }
        .timer-danger-text {
            color: #ff4c4c !important;
        }

        /* حاوية القطع المأكولة */
        .captured-area {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            min-height: 42px;
            background-color: #262421;
            border-radius: 8px;
            padding: 5px 10px;
            align-items: center;
            justify-content: flex-start;
            transition: background-color 0.3s;
        }
        .captured-area.top { margin-bottom: 10px; }
        .captured-area.bottom { margin-top: 10px; margin-bottom: 15px; }
        .captured-piece {
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .captured-piece:hover {
            transform: scale(1.1);
        }
        .selected-captured {
            border: 2px solid #81b64c;
            border-radius: 4px;
            background-color: rgba(129, 182, 76, 0.3);
            transform: scale(1.1);
        }

        /* نافذة التحذير المنبثقة */
        #drawWarningModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9998;
        }
        .warning-box {
            background-color: #262421;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            width: 90%;
            max-width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 2px solid #e67e22;
            transition: background-color 0.3s;
        }
        .warning-box h3 { color: #f39c12; margin-top: 0; }
        .warning-box p { color: #ddd; font-size: 15px; margin-bottom: 20px; }
        .warning-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        .warning-btn:hover { background-color: #d35400; }

        /* نافذة الترقية الحرة */
        #promotionModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10001;
        }
        .promotion-box {
            background-color: #262421;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 90%;
            max-width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 2px solid #81b64c;
            transition: background-color 0.3s;
        }
        .promotion-box h3 { color: #fff; margin-top: 0; margin-bottom: 15px; transition: color 0.3s; }
        .promotion-piece {
            width: 60px; height: 60px; cursor: pointer; transition: transform 0.2s; margin: 5px;
            background-color: #363431; border-radius: 8px; padding: 5px;
        }
        .promotion-piece:hover { transform: scale(1.1); background-color: #81b64c; }

        /* ---------------- أنماط جديدة (لايت مود / ديسكتوب) ---------------- */
        body.light-mode { background-color: #f4f6f8; color: #2c3e50; }
        body.light-mode #loginOverlay { background-color: #f4f6f8; }
        body.light-mode .login-box, body.light-mode .info-container, body.light-mode .timer-box, body.light-mode .captured-area, body.light-mode .warning-box, body.light-mode .promotion-box { background-color: #ffffff; color: #2c3e50; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        body.light-mode .login-box h3, body.light-mode h2, body.light-mode .promotion-box h3, body.light-mode .warning-box p { color: #2c3e50; }
        body.light-mode .login-box input { background-color: #f9f9f9; color: #2c3e50; border: 1px solid #ccc; }
        body.light-mode select, body.light-mode button:not(.btn-primary):not(.btn-danger):not(.btn-info):not(#manualTurnBtn):not(#scanBoardBtn) { background-color: #ecf0f1; color: #2c3e50; border: 1px solid #bdc3c7; }
        body.light-mode button:not(.btn-primary):not(.btn-danger):not(.btn-info):not(#manualTurnBtn):not(#scanBoardBtn):hover { background-color: #d5dbdb; }
        body.light-mode .timer-active { border-color: #27ae60; background-color: #eafaf1; box-shadow: 0 0 10px rgba(39, 174, 96, 0.3); }

        body.desktop-view .container-w, body.desktop-view #board, body.desktop-view .info-container, body.desktop-view .settings-grid, body.desktop-view .buttons-grid, body.desktop-view .auto-play-grid, body.desktop-view .timer-grid, body.desktop-view .captured-area {
            max-width: 750px !important;
        }
    </style>

<body>

    <!-- واجهة تسجيل الدخول -->
    <div id="loginOverlay">
        <div class="login-box">
            <h3 style="margin-top:0;">شطرنج - نظام محمي 🔒</h3>
            <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور...">
            <button id="loginBtn" class="btn-primary" style="width: 100%;">دخول</button>
            <div id="loginError" style="color: #ff4c4c; display: none; margin-top: 10px; font-weight: bold;">كلمة المرور غير صحيحة!</div>
        </div>
    </div>

    <!-- نافذة تحذير التعادل -->
    <div id="drawWarningModal">
        <div class="warning-box">
            <h3>⚠️ تحذير تعادل وشيك!</h3>
            <p id="drawWarningText">الحركة دي هتوصل الجيم لتعادل (ستيماليت أو تكرار)! متأكد إنك عايز تلعبها؟</p>
            <button class="warning-btn" id="closeWarningBtn">حسناً، فهمت</button>
        </div>
    </div>

    <!-- نافذة الترقية الحرة -->
    <div id="promotionModal">
        <div class="promotion-box">
            <h3>اختر القطعة للترقية</h3>
            <div id="promotionPieces" style="display: flex; justify-content: space-around; flex-wrap: wrap;">
                <!-- سيتم إضافة الصور برمجياً حسب لون اللاعب -->
            </div>
        </div>
    </div>

    <!-- اللعبة الأساسية -->
    <div id="gameContainer">

        <!-- الإضافات الجديدة فوق خالص -->
        <div class="top-bar container-w" id="topBar" style="display: flex; margin-bottom:10px;">
            <button id="themeToggleBtn" style="flex:1;">☀️ لايت مود</button>
            <button id="viewToggleBtn" style="flex:1;">💻 ديسكتوب</button>
        </div>

        <div class="buttons-grid container-w" style="margin-bottom:15px; margin-top:5px;">
            <button id="freePlayBtn" class="btn-info" style="background-color: rgb(91, 192, 222); color: white;">🔓 اللعب الحر: إيقاف</button>
            <button id="manualTurnBtn" style="background-color:#9b59b6; color:#fff;">🔄 الدور حالياً: الأبيض</button>
            <button id="scanBoardBtn" style="background-color:#f39c12; color:#fff; grid-column:span 2;">📸 إعداد الرقعة (صورة/FEN)</button>
        </div>

        <!-- عدادات التوقيت -->
        <div class="timer-grid container-w">
            <div id="whiteTimerBox" class="timer-box timer-active">
                <span style="font-size: 14px; color: #aaa;">الأبيض</span>
                <span id="whiteTimerText">10:00</span>
            </div>
            <div id="blackTimerBox" class="timer-box">
                <span style="font-size: 14px; color: #aaa;">الأسود</span>
                <span id="blackTimerText">10:00</span>
            </div>
        </div>

        <div class="info-container container-w">
            <h2>شطرنج متكامل ♟️</h2>
            <div id="status">الأبيض بيلعب</div>
        </div>

        <div class="settings-grid container-w">
            <select id="gameMode">
                <option value="vsPC">أنا ضد الكمبيوتر 🤖</option>
                <option value="vsHuman">لعب ثنائي أوفلاين 👥</option>
                <option value="stockfish">مود ستوك فيش (تحليل آلي) 🧠</option>
            </select>
            <select id="difficulty">
                <option value="1">مستوى 1 (مبتدئ - خطوة 1)</option>
                <option value="2">مستوى 2 (سهل - 3 خطوات)</option>
                <option value="3">مستوى 3 (متوسط - 5 خطوات)</option>
                <option value="4">مستوى 4 (صعب - 10 خطوات)</option>
                <option value="5">مستوى 5 (محترف - 15 خطوة)</option>
                <option value="6" selected>مستوى 6 (جراند ماستر - 20 خطوة)</option>
            </select>
            <select id="timeControl">
                <option value="180">3 دقائق ⚡</option>
                <option value="300">5 دقائق ⏱️</option>
                <option value="600" selected>10 دقائق 🕰️</option>
                <option value="1800">30 دقيقة 🐢</option>
                <option value="0">بدون وقت ⏳</option>
            </select>
        </div>

        <!-- القطع المأكولة (الجزء العلوي) -->
        <div id="capturedTop" class="captured-area top container-w"></div>

        <div id="board"></div>
        
        <!-- القطع المأكولة (الجزء السفلي) -->
        <div id="capturedBottom" class="captured-area bottom container-w"></div>
        
        <!-- أزرار اللعب التلقائي -->
        <div class="auto-play-grid container-w" id="autoPlayControls" style="display:none;">
            <button id="autoWhiteBtn">👤 أبيض تلقائي: إيقاف</button>
            <button id="autoBlackBtn">👤 أسود تلقائي: إيقاف</button>
        </div>

        <div class="buttons-grid container-w">
            <button id="undoBtn">◀ رجوع خطوة</button>
            <button id="redoBtn">خطوة لقدام ▶</button>
            <button id="flipBtn">🔃 قلب الطاولة</button>
            <button id="switchColorBtn">🔄 العب بالأسود</button>
            <button id="restartBtn" class="btn-primary">ابدأ جيم جديد</button>
            <button id="stopAllBtn" class="btn-danger">🛑 إيقاف الكل</button>
        </div>
    </div>

    <!-- استدعاء المكتبات الأساسية -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>
    
    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');
        
        var stateHistory = [];
        var currentStateIndex = -1;

        var isThinking = false;
        var selectedSquare = null; 
        var selectedCapturedPiece = null;
        var forceStop = false; 
        var pendingPromotion = null;
        
        var autoWhite = false;
        var autoBlack = false;

        var timerInterval = null;
        var whiteTime = 600;
        var blackTime = 600;
        var timerStarted = false;
        var timeIsOut = false;

        // المتغيرات الخاصة بالإضافات
        var isLightMode = false;
        var isDesktopView = false;
        var isFreePlay = false;

        // ---------- تهيئة محرك ستوك فيش الحقيقي (الطريقة المضمونة والجديدة) ---------- //
        var engineReady = false;
        var engine = null;

        function setupEngine(eng) {
            eng.onmessage = function(event) {
                var line = typeof event === 'string' ? event : event.data;
                if (line.indexOf('uciok') > -1 || line.indexOf('readyok') > -1) {
                    engineReady = true;
                } else if (line.indexOf('bestmove') > -1) {
                    if (forceStop) {
                        forceStop = false;
                        isThinking = false;
                        return;
                    }

                    var match = line.match(/^bestmove\s([a-h][1-8])([a-h][1-8])([qrob])?/);
                    if (match) {
                        game.move({
                            from: match[1],
                            to: match[2],
                            promotion: match[3] || 'q'
                        });
                        board.position(game.fen());
                        saveCurrentState(match[1], match[2]);
                        startTimer(); 
                        updateStatus();
                        isThinking = false;
                        checkAutoPlay();
                    } else {
                        isThinking = false;
                        updateStatus();
                    }
                }
            };
            eng.postMessage('uci');
            eng.postMessage('isready');
        }

        // الطريقة دي بتمنع حظر المتصفحات للمحرك (CORS bypass) وبتضمن إنه يشتغل دايماً
        fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')
            .then(response => response.text())
            .then(script => {
                var blob = new Blob([script], { type: 'application/javascript' });
                var url = window.URL.createObjectURL(blob);
                engine = new Worker(url);
                setupEngine(engine);
            })
            .catch(err => {
                console.log("تعذر تحميل ستوك فيش، سيتم استخدام المحرك البديل.", err);
                engine = null;
            });

        // ---------- نظام الحماية بكلمة المرور ----------
        $(document).ready(function() {
            var authKey = 'chess_auth_secure_v11'; 
            if (localStorage.getItem(authKey) === 'true') {
                $('#loginOverlay').hide();
                $('#gameContainer').css('display', 'flex');
                initChessGame();
            } else {
                $('#loginOverlay').css('display', 'flex');
            }

            $('#loginBtn').on('click', function() {
                var pwd = $('#passwordInput').val();
                if (pwd === '#ZMsd42d*') {
                    localStorage.setItem(authKey, 'true');
                    $('#loginError').hide();
                    $('#loginOverlay').fadeOut(300, function() {
                        $('#gameContainer').css('display', 'flex');
                        initChessGame(); 
                    });
                } else {
                    $('#loginError').show();
                }
            });

            $('#passwordInput').on('keypress', function(e) {
                if (e.which === 13) $('#loginBtn').click();
            });

            $('#closeWarningBtn').on('click', function() {
                $('#drawWarningModal').fadeOut(200);
            });
        });

        // ---------- إدارة التوقيت ----------
        function formatTime(seconds) {
            if (seconds <= 0) return "00:00";
            var m = Math.floor(seconds / 60);
            var s = seconds % 60;
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

        function updateTimerUI() {
            var tc = $('#timeControl').val();
            if (tc === "0") {
                $('#whiteTimerText').text("∞");
                $('#blackTimerText').text("∞");
                $('#whiteTimerBox, #blackTimerBox').removeClass('timer-active');
                return;
            }

            $('#whiteTimerText').text(formatTime(whiteTime));
            $('#blackTimerText').text(formatTime(blackTime));

            if (whiteTime <= 30 && whiteTime > 0) $('#whiteTimerText').addClass('timer-danger-text');
            else $('#whiteTimerText').removeClass('timer-danger-text');

            if (blackTime <= 30 && blackTime > 0) $('#blackTimerText').addClass('timer-danger-text');
            else $('#blackTimerText').removeClass('timer-danger-text');

            $('#whiteTimerBox, #blackTimerBox').removeClass('timer-active');
            if (timerStarted && !game.game_over() && !timeIsOut && !forceStop) {
                if (game.turn() === 'w') $('#whiteTimerBox').addClass('timer-active');
                else $('#blackTimerBox').addClass('timer-active');
            }
        }

        function tickTimer() {
            if (game.game_over() || timeIsOut || $('#timeControl').val() === "0" || forceStop) {
                clearInterval(timerInterval);
                return;
            }

            if (game.turn() === 'w') {
                whiteTime--;
                if (whiteTime <= 0) {
                    whiteTime = 0;
                    timeIsOut = true;
                    updateStatus();
                }

        // ---------- محرك Minimax (البديل السريع لمنع التهنيج) ---------- //
        function getPieceValue(piece, x, y) {
            if (piece === null) return 0;
            var val = 0;
            if (piece.type === 'p') val = 100;
            else if (piece.type === 'n') val = 320;
            else if (piece.type === 'b') val = 330;
            else if (piece.type === 'r') val = 500;
            else if (piece.type === 'q') val = 900;
            else if (piece.type === 'k') val = 20000;

            var pawnEvalWhite = [
                [0,0,0,0,0,0,0,0],[50,50,50,50,50,50,50,50],[10,10,20,30,30,20,10,10],
                [5,5,10,25,25,10,5,5],[0,0,0,20,20,0,0,0],[5,-5,-10,0,0,-10,-5,5],
                [5,10,10,-20,-20,10,10,5],[0,0,0,0,0,0,0,0]
            ];
            var knightEval = [
                [-50,-40,-30,-30,-30,-30,-40,-50],[-40,-20,0,0,0,0,-20,-40],[-30,0,10,15,15,10,0,-30],
                [-30,5,15,20,20,15,5,-30],[-30,0,15,20,20,15,0,-30],[-30,5,10,15,15,10,5,-30],
                [-40,-20,0,5,5,0,-20,-40],[-50,-40,-30,-30,-30,-30,-40,-50]
            ];
            var positionalScore = 0;
            if (piece.type === 'p') positionalScore = (piece.color === 'w') ? pawnEvalWhite[x][y] : pawnEvalWhite[7 - x][y];
            else if (piece.type === 'n') positionalScore = knightEval[x][y];
            val += positionalScore;
            return piece.color === 'w' ? val : -val;
        }

        function evaluateBoard(tempGame) {
            var totalEvaluation = 0;
            var boardArray = tempGame.board(); 
            for (var i = 0; i < 8; i++) {
                for (var j = 0; j < 8; j++) {
                    var piece = boardArray[i][j];
                    if(piece) {
                        totalEvaluation += getPieceValue(piece, i, j);
                    }
                }
            }
            return totalEvaluation;
        }

        function minimax(depth, tempGame, alpha, beta, isMaximisingPlayer) {
            if (depth === 0) return evaluateBoard(tempGame);
            var newGameMoves = tempGame.moves({ verbose: true });
            if (newGameMoves.length === 0) {
                if (tempGame.in_checkmate()) return isMaximisingPlayer ? -999999 : 999999;
                return 0; 
            }
            newGameMoves.sort(function(a, b) {
                var aScore = (a.flags.indexOf('c') !== -1 || a.flags.indexOf('e') !== -1) ? 10 : 0;
                var bScore = (b.flags.indexOf('c') !== -1 || b.flags.indexOf('e') !== -1) ? 10 : 0;
                return bScore - aScore;
            });
            if (isMaximisingPlayer) {
                var bestMove = -999999;
                for (var i = 0; i < newGameMoves.length; i++) {
                    tempGame.move(newGameMoves[i]);
                    bestMove = Math.max(bestMove, minimax(depth - 1, tempGame, alpha, beta, !isMaximisingPlayer));
                    tempGame.undo();
                    alpha = Math.max(alpha, bestMove);
                    if (beta <= alpha) break;
                }
                return bestMove;
            } else {
                var bestMove = 999999;
                for (var i = 0; i < newGameMoves.length; i++) {
                    tempGame.move(newGameMoves[i]);
                    bestMove = Math.min(bestMove, minimax(depth - 1, tempGame, alpha, beta, !isMaximisingPlayer));
                    tempGame.undo();
                    beta = Math.min(beta, bestMove);
                    if (beta <= alpha) break;
                }
                return bestMove;
            }
        }

        function minimaxRoot(depth, tempGame, isMaximisingPlayer) {
            var newGameMoves = tempGame.moves({ verbose: true });
            if (newGameMoves.length === 0) return null;
            newGameMoves.sort(function(a, b) {
                var aScore = (a.flags.indexOf('c') !== -1 || a.flags.indexOf('e') !== -1) ? 10 : 0;
                var bScore = (b.flags.indexOf('c') !== -1 || b.flags.indexOf('e') !== -1) ? 10 : 0;
                return bScore - aScore;
            });
            var bestMove = isMaximisingPlayer ? -999999 : 999999;
            var bestMoveFound = newGameMoves[0];
            for (var i = 0; i < newGameMoves.length; i++) {
                var newGameMove = newGameMoves[i];
                tempGame.move(newGameMove);
                var value = minimax(depth - 1, tempGame, -1000000, 1000000, !isMaximisingPlayer);
                tempGame.undo();
                if (isMaximisingPlayer) {
                    if (value > bestMove) { bestMove = value; bestMoveFound = newGameMove; }
                } else {
                    if (value < bestMove) { bestMove = value; bestMoveFound = newGameMove; }
                }
            }
            return bestMoveFound;
        }

        // ---------- إدارة حركات الذكاء الاصطناعي (تم التعديل لمنع التهنيج) ----------
        function makeAIMove() {
            var mode = $('#gameMode').val();
            var turn = game.turn();
            var pColor = board.orientation() === 'white' ? 'w' : 'b';

            if (mode === 'vsPC' && turn === pColor) { isThinking = false; return; }
            if (mode === 'stockfish') {
                if (turn === 'w' && !autoWhite) { isThinking = false; return; }
                if (turn === 'b' && !autoBlack) { isThinking = false; return; }
            }

            var level = parseInt($('#difficulty').val());
            
            if (engine && engineReady) {
                var skillLevel = 0;
                var moveCommand = 'go depth 1';
                // استخدام عمق تفكير (Depth) بدلاً من الوقت (movetime) لمنع التهنيج التام على الموبايل
                if (level === 1) { skillLevel = 0; moveCommand = 'go depth 1'; }
                if (level === 2) { skillLevel = 3; moveCommand = 'go depth 2'; }
                if (level === 3) { skillLevel = 7; moveCommand = 'go depth 4'; }
                if (level === 4) { skillLevel = 12; moveCommand = 'go depth 6'; }
                if (level === 5) { skillLevel = 17; moveCommand = 'go depth 8'; }
                if (level === 6) { skillLevel = 20; moveCommand = 'go depth 10'; } // يحلل أسرع بكثير وقوي جداً

                engine.postMessage('setoption name Skill Level value ' + skillLevel);
                engine.postMessage('position fen ' + game.fen());
                engine.postMessage(moveCommand);
            } else {
                var mmDepth = 3; 
                if (level === 1) mmDepth = 1;
                if (level === 2) mmDepth = 2;
                if (level >= 3) mmDepth = 3; 

                window.aiTimeout = setTimeout(function() {
                    if (forceStop) { forceStop = false; isThinking = false; return; }
                    var virtualGame = new Chess(game.fen());
                    var isMax = (turn === 'w');
                    var bestMove = minimaxRoot(mmDepth, virtualGame, isMax);
                    
                    if (bestMove) {
                        game.move(bestMove); 
                        saveCurrentState(bestMove.from, bestMove.to);
                    } else {
                        var fallbackMoves = game.moves({verbose: true});
                        if(fallbackMoves.length > 0) {
                            game.move(fallbackMoves[0]);
                            saveCurrentState(fallbackMoves[0].from, fallbackMoves[0].to);
                        }
                    }
                    board.position(game.fen());
                    startTimer();
                    updateStatus();
                    isThinking = false;
                    checkAutoPlay();
                }, 50);
            }
        }

        // ---------- نظام الحركة بالضغطة (على الرقعة) ----------
        $('#board').on('click', '.square-55d63', function() {
            if (isThinking || board === null || pendingPromotion) return;
            forceStop = false; 

            var square = $(this).attr('data-square');
            var piece = game.get(square);

            // تفعيل نظام اللعب الحر
            if (isFreePlay) {
                if (selectedCapturedPiece) {
                    game.put({ type: selectedCapturedPiece.type, color: selectedCapturedPiece.color }, square);
                    board.position(game.fen());
                    saveCurrentState(null, square); 
                    selectedCapturedPiece = null;
                    renderCapturedPieces();
                    updateStatus();
                    return;
                }

                if (selectedSquare) {
                    if (selectedSquare === square) {
                        selectedSquare = null;
                        removeHighlights();
                        return;
                    }
                    var p = game.get(selectedSquare);
                    if (p) {
                        game.remove(selectedSquare);
                        game.put(p, square);
                        board.position(game.fen());
                        saveCurrentState(selectedSquare, square);
                        selectedSquare = null;
                        removeHighlights();
                        updateStatus();
                    }
                    return;
                } else {
                    if (piece) {
                        selectedSquare = square;
                        removeHighlights();
                        $('#board .square-' + square).addClass('highlight-square');
                    }
                    return;
                }
            }

            // اللعب العادي
            if (game.game_over() || timeIsOut) return;
            var mode = $('#gameMode').val();
            var pColor = board.orientation() === 'white' ? 'w' : 'b';

            if (mode === 'vsPC' && game.turn() !== pColor) return;
            if (mode === 'stockfish') {
                if (game.turn() === 'w' && autoWhite) return;
                if (game.turn() === 'b' && autoBlack) return;
            }

            if (selectedCapturedPiece) {
                if (piece) {
                    if (piece.color === game.turn()) {
                        selectedCapturedPiece = null;
                        renderCapturedPieces();
                        selectedSquare = square;
                        highlightLegalMoves(square);
                    } else {
                        selectedCapturedPiece = null;
                        renderCapturedPieces();
                    }
                    return;
                }

                if (selectedCapturedPiece.type === 'p' && (square[1] === '1' || square[1] === '8')) {
                    selectedCapturedPiece = null;
                    renderCapturedPieces();
                    return;
                }

                game.put({ type: selectedCapturedPiece.type, color: selectedCapturedPiece.color }, square);
                changeTurnInFen();
                startTimer(); 
                board.position(game.fen());
                saveCurrentState(null, square); 
                selectedCapturedPiece = null;
                updateStatus();
                checkAutoPlay();
                return;
            }

            if (selectedSquare) {
                if (selectedSquare === square) {
                    selectedSquare = null;
                    removeHighlights();
                    return;
                }

                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    removeHighlights();
                    highlightLegalMoves(square);
                    return;
                }

                // فحص إذا كانت الحركة تتطلب ترقية
                var isPromotionMove = false;
                var legalMoves = game.moves({ verbose: true });
                for (var i = 0; i < legalMoves.length; i++) {
                    if (legalMoves[i].from === selectedSquare && legalMoves[i].to === square && legalMoves[i].promotion) {
                        isPromotionMove = true;
                        break;
                    }
                }

                if (isPromotionMove) {
                    pendingPromotion = { from: selectedSquare, to: square };
                    var promoColor = game.turn();
                    var piecesHtml = '';
                    var prompPieces = ['q', 'r', 'b', 'n'];
                    prompPieces.forEach(function(p) {
                        piecesHtml += '<img src="https://chessboardjs.com/img/chesspieces/wikipedia/' + promoColor + p.toUpperCase() + '.png" class="promotion-piece" data-piece="' + p + '">';
                    });
                    $('#promotionPieces').html(piecesHtml);
                    $('#promotionModal').css('display', 'flex');
                    return; 
                }

                var drawMsg = checkMoveForDrawWarning(selectedSquare, square);
                if (drawMsg) {
                    $('#drawWarningText').text(drawMsg + " هل أنت متأكد من تنفيذها؟");
                    $('#drawWarningModal').css('display', 'flex');
                }

                var move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q' 
                });

                if (move) {
                    startTimer(); 
                    board.position(game.fen());
                    removeHighlights();
                    selectedSquare = null;
                    saveCurrentState(move.from, move.to);
                    updateStatus();
                    checkAutoPlay(); 
                } else {
                    selectedSquare = null;
                    removeHighlights();
                }
            } else {
                if (!piece || piece.color !== game.turn()) return; 

                selectedSquare = square;
                removeHighlights();
                highlightLegalMoves(square);
            }
        });

        // ---------- تحديث حالة الجيم وتلوين القطع ----------
        function updateStatus() {
            var statusHTML = '';
            var moveColor = game.turn() === 'b' ? 'الأسود' : 'الأبيض';
            
            // تحديث زرار الدور
            $('#manualTurnBtn').text('🔄 الدور حالياً: ' + moveColor);

            if (timeIsOut) {
                var loserColor = (whiteTime <= 0) ? 'الأبيض' : 'الأسود';
                statusHTML = 'انتهى الوقت! ' + loserColor + ' خسر الجيم ⏳';
                clearInterval(timerInterval);
            } else if (game.in_checkmate()) {
                statusHTML = 'كش مات! ' + moveColor + ' خسر الجيم.';
                clearInterval(timerInterval);
            } else if (game.in_draw()) {
                statusHTML = 'الجيم خلص تعادل!';
                clearInterval(timerInterval);
            } else {
                statusHTML = 'دور: ' + moveColor;
                if (game.in_check()) statusHTML += ' (كش ملك!)';
            }
            $status.html(statusHTML);
            
            $('.square-55d63').removeClass('highlight-last-move');
            if (currentStateIndex >= 0 && stateHistory[currentStateIndex] && stateHistory[currentStateIndex].lastMove) {
                var last = stateHistory[currentStateIndex].lastMove;
                if (last.from) $('#board .square-' + last.from).addClass('highlight-last-move');
                if (last.to) $('#board .square-' + last.to).addClass('highlight-last-move');
            }

            renderCapturedPieces();
            updateTimerUI();
            saveGameState(); 
        }

        // ---------- زراير التحكم واللعب التلقائي ----------
        $('#autoWhiteBtn').on('click', function() {
            if (timeIsOut) return;
            forceStop = false; 
            autoWhite = !autoWhite;
            updateAutoButtonsUI();
            if (!isThinking) checkAutoPlay();
        });

        $('#autoBlackBtn').on('click', function() {
            if (timeIsOut) return;
            forceStop = false; 
            autoBlack = !autoBlack;
            updateAutoButtonsUI();
            if (!isThinking) checkAutoPlay();
        });

        $('#undoBtn').on('click', function() {
            forceStop = false; 
            if (isThinking) return;
            selectedSquare = null;
            selectedCapturedPiece = null;
            pendingPromotion = null;
            $('#promotionModal').hide();
            removeHighlights();
            renderCapturedPieces();
            
            var mode = $('#gameMode').val();
            var undid = false;
            
            if (mode === 'vsPC' || mode === 'stockfish') {
                if (currentStateIndex > 1) { 
                    currentStateIndex -= 2;
                    undid = true;
                }
            } else {
                if (currentStateIndex > 0) {
                    currentStateIndex--;
                    undid = true;
                }
            }

            if (undid) {
                var s = stateHistory[currentStateIndex];
                game.load(s.fen);
                board.position(s.fen);
                updateStatus();
                checkAutoPlay();
            }
        });

        $('#redoBtn').on('click', function() {
            forceStop = false;
            if (isThinking) return;
            selectedSquare = null;
            selectedCapturedPiece = null;
            pendingPromotion = null;
            $('#promotionModal').hide();
            removeHighlights();
            renderCapturedPieces();

            var mode = $('#gameMode').val();
            var redid = false;
            
            if ((mode === 'vsPC' || mode === 'stockfish') && currentStateIndex < stateHistory.length - 2) {
                currentStateIndex += 2;
                redid = true;
            } else if (currentStateIndex < stateHistory.length - 1) {
                currentStateIndex++;
                redid = true;
            }

            if (redid) {
                var s = stateHistory[currentStateIndex];
                game.load(s.fen);
                board.position(s.fen);
                updateStatus();
                checkAutoPlay();
            }
        });

        $('#flipBtn').on('click', function() {
            if (board === null) return;
            board.flip();
            selectedSquare = null;
            removeHighlights();
            updateStatus(); 
            saveGameState();
        });

        $('#switchColorBtn').on('click', function() {
            if (isThinking || board === null || forceStop) return;
            forceStop = false;
            game.reset();
            stateHistory = [];
            currentStateIndex = -1;
            saveCurrentState(null, null);
            selectedSquare = null;
            selectedCapturedPiece = null;
            pendingPromotion = null;
            $('#promotionModal').hide();
            resetTimer();
            removeHighlights();
            if (board.orientation() === 'white') {
                board.orientation('black');
                $(this).text('🔄 العب بالأبيض');
            } else {
                board.orientation('white');
                $(this).text('🔄 العب بالأسود');
            }
            board.start();
            updateStatus();
            checkAutoPlay();
        });

        $('#restartBtn').on('click', function() {
            if (isThinking || board === null) return;
            game.reset();
            stateHistory = [];
            currentStateIndex = -1;
            saveCurrentState(null, null);
            selectedSquare = null;
            selectedCapturedPiece = null;
            pendingPromotion = null;
            $('#promotionModal').hide();
            forceStop = false;
            resetTimer();
            board.start();
            board.orientation('white');
            $('#switchColorBtn').text('🔄 العب بالأسود');
            updateStatus();
            removeHighlights();
            checkAutoPlay();
        });

        $('#gameMode, #difficulty').on('change', function() {
            if (isThinking) return;
            selectedSquare = null;
            selectedCapturedPiece = null;
            pendingPromotion = null;
            $('#promotionModal').hide();
            forceStop = false;
            removeHighlights();
            updateAutoButtonsUI();
            saveGameState();
            checkAutoPlay();
        });

        $('#timeControl').on('change', function() {
            $('#restartBtn').click();
        });

        $('#stopAllBtn').on('click', function() {
            forceStop = true; 
            if (engine) engine.postMessage('stop'); 
            clearTimeout(window.aiTimeout); 
            
            isThinking = false;
            autoWhite = false;
            autoBlack = false;
            updateAutoButtonsUI();
            
            clearInterval(timerInterval); 
            timerStarted = false;
            
            selectedSquare = null;
            selectedCapturedPiece = null;
            pendingPromotion = null;
            $('#promotionModal').hide();
            removeHighlights();
            renderCapturedPieces();

            var currentHtml = $('#status').html();
            var cleanHtml = currentHtml.replace(/<span.*?\(.*?\).*?<\/span>/g, '');
            $('#status').html(cleanHtml + ' <span style="color:#ff4c4c; font-size:0.8em;">[تم الإيقاف]</span>');
            
            saveGameState();
        });

    </script>
</body>
</html>
